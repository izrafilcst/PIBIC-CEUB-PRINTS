<text x="40.000" y="166.000" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.4" font-weight="normal" fill="#555" text-anchor="start">Testa o engate real da rosca: o botao e parafusado direto na placa.</text>
<text x="40.000" y="169.500" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.4" font-weight="normal" fill="#555" text-anchor="start">&#948; e a folga radial somada ao perfil ISO; D = 24 + 2&#948;, D1 = 21,835 + 2&#948;.</text>
<text x="40.000" y="173.000" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.4" font-weight="normal" fill="#555" text-anchor="start">8 mm de espessura = 4 passos completos de engate.</text>
<text x="40.000" y="176.500" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.4" font-weight="normal" fill="#555" text-anchor="start">O chanfro 8x8 identifica o canto da MENOR folga (&#948; = 0,10).</text>
<text x="40.000" y="180.000" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.4" font-weight="normal" fill="#555" text-anchor="start">Antes de adotar rosca na tampa final, confirmar que o botao tem</text>
<text x="40.000" y="183.500" font-family="DejaVu Sans, Arial, sans-serif" font-size="2.4" font-weight="normal" fill="#555" text-anchor="start">comprimento roscado suficiente (ver pendencias no README).</text>
